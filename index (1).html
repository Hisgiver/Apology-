<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>11:11 — For You</title>
<style>
:root{--bg1:#0b0b24;--bg2:#2a1040;--ink:#fff4f8;--glow:#ff8fb8;--gold:#ffd9a0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(#0b0b24,#2a1040 70%,#4a1a55);background:linear-gradient(var(--bg1),var(--bg2) 70%,#4a1a55);color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow:hidden;text-align:center;-webkit-tap-highlight-color:transparent}
.stars,.hearts{position:fixed;inset:0;pointer-events:none}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.heart{position:absolute;bottom:-30px;color:var(--glow);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.8}100%{transform:translateY(-110vh) scale(1.2);opacity:0}}
.shoot{position:fixed;top:12%;left:-20%;width:120px;height:2px;background:linear-gradient(90deg,transparent,#fff);transform:rotate(25deg);opacity:0}
.shoot.go{animation:shoot 1.6s ease-out forwards}
@keyframes shoot{0%{left:-20%;top:8%;opacity:1}100%{left:110%;top:45%;opacity:0}}
main{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px}
.clock{font-size:clamp(64px,22vw,120px);letter-spacing:.06em;color:var(--gold);text-shadow:0 0 24px var(--gold),0 0 60px var(--glow);animation:pulse 2.4s infinite ease-in-out}
@keyframes pulse{50%{text-shadow:0 0 40px var(--gold),0 0 90px var(--glow);transform:scale(1.04)}}
.line{max-width:30ch;font-size:clamp(20px,5.4vw,28px);line-height:1.5;opacity:0;transform:translateY(14px);transition:opacity 1.4s ease,transform 1.4s ease}
.line.show{opacity:1;transform:none}
.small{font-size:14px;opacity:.6;letter-spacing:.08em;font-style:italic}
.big{font-size:clamp(30px,9vw,46px);color:var(--glow);text-shadow:0 0 20px var(--glow)}
button{margin-top:10px;background:none;border:1px solid var(--glow);color:var(--ink);padding:10px 22px;border-radius:999px;font:inherit;font-size:15px;opacity:0;transition:opacity 1s;cursor:pointer}
button.show{opacity:1}
.hint{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;font-size:12px;opacity:.45;letter-spacing:.1em}
@media (prefers-reduced-motion:reduce){.star,.heart,.clock{animation:none}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="hearts" id="hearts"></div>
<div class="shoot" id="shoot"></div>
<main id="stage"></main>
<div class="hint" id="hint">tap anywhere to continue</div>
<script>
// Edit the words below to make it yours.
var scenes=[
 {clock:"11:11",small:"make a wish",wish:true},
 {t:"On 11:11, I wished for you.",big:false},
 {t:"Not for anything big. Just for you to smile again."},
 {t:"I’m sorry for hurting you.",big:true},
 {t:"I should have listened better, and been kinder when it mattered."},
 {t:"You deserve patience, honesty, and someone who stays."},
 {t:"I want to be that person for you, every day, not only on special dates."},
 {t:"Thank you for being you.",big:true},
 {t:"I love you. Always.",big:true,end:true}
];
var i=-1,busy=false,stage=document.getElementById('stage'),hint=document.getElementById('hint');
// background stars and hearts
var sEl=document.getElementById('stars');
for(var k=0;k<70;k++){var s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(Math.random()*3)+'s';s.style.animationDuration=(2+Math.random()*3)+'s';sEl.appendChild(s)}
var hEl=document.getElementById('hearts');
for(var h=0;h<14;h++){var e=document.createElement('span');e.className='heart';e.textContent='♥';e.style.left=Math.random()*100+'%';e.style.fontSize=(12+Math.random()*18)+'px';e.style.animationDuration=(9+Math.random()*9)+'s';e.style.animationDelay=(Math.random()*10)+'s';hEl.appendChild(e)}
function next(){
 if(busy)return;busy=true;i++;
 if(i>=scenes.length){i=-1;next();return}
 var sc=scenes[i];stage.innerHTML='';
 if(sc.clock){
  var c=document.createElement('div');c.className='clock';c.textContent=sc.clock;stage.appendChild(c);
  var p=document.createElement('div');p.className='line small';p.textContent=sc.small;stage.appendChild(p);
  setTimeout(function(){p.classList.add('show')},300);
  setTimeout(function(){var sh=document.getElementById('shoot');sh.classList.remove('go');void sh.offsetWidth;sh.classList.add('go')},900);
 } else {
  var d=document.createElement('div');d.className='line'+(sc.big?' big':'');d.textContent=sc.t;stage.appendChild(d);
  setTimeout(function(){d.classList.add('show')},200);
  if(sc.end){
   var b=document.createElement('button');b.textContent='replay ♥';stage.appendChild(b);
   setTimeout(function(){b.classList.add('show')},2200);
   hint.style.display='none';
  } else hint.style.display='block';
 }
 setTimeout(function(){busy=false},1300);
}
document.addEventListener('click',next);
next();
</script>
</body>
</html>
